import java.util.Properties

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def baseUrl = localProperties.getProperty('BASE_URL')
        ?: project.findProperty('BASE_URL')
        ?: 'https://run.mocky.io/'
def stocksToken = localProperties.getProperty('STOCKS_TOKEN')
        ?: project.findProperty('STOCKS_TOKEN')
        ?: '6d0ad460-f600-47a7-b973-4a779ebbaeaf'
def useLocalMock = (localProperties.getProperty('USE_LOCAL_MOCK')
        ?: project.findProperty('USE_LOCAL_MOCK')
        ?: 'true').toBoolean()

android {
    namespace 'com.android.stocks.data'
    compileSdk 35

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField 'String', 'BASE_URL', "\"${baseUrl}\""
        buildConfigField 'String', 'STOCKS_TOKEN', "\"${stocksToken}\""
        buildConfigField 'boolean', 'USE_LOCAL_MOCK', "${useLocalMock}"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':domain')
    implementation project(':core:common')

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.serialization.json

    implementation libs.retrofit
    implementation libs.retrofit.serialization
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.javax.inject

    testImplementation libs.junit
    testImplementation libs.kotlin.test
    testImplementation libs.truth
    testImplementation libs.kotlinx.coroutines.test
}
